html,body{height:100%}

main{flex:1;overflow-y:auto;padding:6px 16px 18px;animation:in .25s ease-out}

.am{font-weight:800;font-size:14px}
.in{color:var(--em)}.out{color:var(--red)}

.fl{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:10px;border-radius:11px;font-weight:600;color:var(--mute)}

.sm{border:0;background:var(--chip);color:var(--lap);font-weight:600;font-size:12px;padding:7px 11px;border-radius:10px}

.cols{display:flex;align-items:flex-end;gap:10px;height:140px}
.cols div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mute);gap:4px}
.cols i{width:100%;border-radius:9px 9px 3px 3px;background:var(--lap);opacity:.55}
.cols div:last-child i{opacity:1;background:var(--gold)}
.tip{background:var(--chip);border-radius:16px;padding:13px;font-size:13px;line-height:1.9;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.two .card{margin:0}
nav{display:flex;align-items:center;background:var(--card);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line)}

nav button span{width:48px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}nav button.on span{background:var(--chip)}.fab .i{stroke-width:2.4}.chips button{display:inline-flex;align-items:center;gap:6px}.sm{display:inline-grid;place-items:center}.ib,.ic{color:var(--lap)}.i{flex:none}
nav button.on{color:var(--lap);font-weight:800}

.ts{position:absolute;bottom:84px;inset-inline:22px;background:var(--ink);color:var(--bg);padding:12px;border-radius:14px;text-align:center;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.ts.show{opacity:1;transform:none}
.em0{text-align:center;color:var(--mute);padding:22px 0;font-size:13px}
.lmi{width:112px;flex:none;margin:0;padding:9px 8px;text-align:center;font-weight:600;font-size:13px}
html[dir=ltr] .flip svg{transform:scaleX(-1)}
@media(max-width:519px){.ph{max-width:none;max-height:none}html,body{height:100dvh}}
.lk{position:absolute;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:auto}.lkb{width:100%;max-width:340px;display:grid;gap:12px;text-align:center}.lkn{font-size:13px;color:var(--mute);line-height:1.8}.lkm{min-height:20px;color:var(--red);font-size:14px}.lks{background:none;border:0;color:var(--lap);font-size:14px;padding:8px}.btn:disabled{opacity:.6}
</style>
</head>

function pi(n){S.cnm=$('cn').value;if($('cb'))S.cbv=$('cb').value;S.ci=n;draw()}
function svc(){const n=$('cn').value.trim();if(!n){toast('نام بخش را بنویسید');$('cn').focus();return}
 const L=S.ck==='e'?CATS:INC;if(L.some(c=>c[0]===n)){toast('این بخش از قبل هست');return}
 L.push([n,S.ci]);if(S.ck==='e'&&$('cb')){const b=pn($('cb').value);if(b)lim[n]=b}
 if(S.from==='add')S.cat=n;S.scr=S.from==='add'?'add':'budget';S.cnm='';S.cbv='';draw();toast('بخش «'+n+'» ساخته شد')}
function dep(k){const g=goals[k],v=pn($('dp'+k).value);if(!v){toast('مبلغ را وارد کنید');return}g.s=Math.min(g.tg,g.s+v);toast(g.s>=g.tg?'تبریک! به هدف رسیدید':'به پس‌انداز اضافه شد');draw()}
function ng(){const n=$('gn').value.trim(),t=parseInt($('gt').value.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)),10);
 if(!n||!t){toast('نام و مبلغ هدف را وارد کنید');return}goals.push({n,tg:t,s:0,e:'star'});S.gf=false;toast('هدف ساخته شد');draw()}
function settle(i){debts=debts.filter(d=>d.id!==i);toast('تسویه شد');draw()}
function ge(k){S.ge=k;S.gd=-1;draw()}
function gd(k){S.gd=k;S.ge=-1;draw()}
function gx(k){goals.splice(k,1);S.gd=-1;toast('هدف حذف شد');draw()}
function gs(k){const n=$('en'+k).value.trim(),t=pn($('et'+k).value),s=pn($('es'+k).value);if(!n||!t){toast('نام و مبلغ هدف را وارد کنید');return}goals[k]={...goals[k],n,tg:t,s:Math.min(s,t)};S.ge=-1;toast('هدف ویرایش شد');draw()}
const MN=['حمل','ثور','جوزا','سرطان','اسد','سنبله','میزان','عقرب','قوس','جدی','دلو','حوت'];
const pd=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const sol=dt=>{try{const p=new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(dt),g=t=>+p.find(x=>x.type===t).value.replace(/\D/g,'');return{y:g('year'),m:g('month'),d:g('day')}}catch(e){return{y:1405,m:9,d:1}}};
const fmtD=o=>o?`${pd(o.d)} ${MN[o.m-1]} ${pd(o.y)}`:'';
function dsl(){S.ddt={d:+$('sd').value,m:+$('sm').value,y:+$('sy').value}}
function dpk(k){if($('sd'))dsl();S.dw=$('dw').value;S.dm=$('da2').value;S.dq=$('dnt').value;S.dsel=k;if(k==='t')S.ddt=sol(new Date());else if(k==='y')S.ddt=sol(new Date(Date.now()-864e5));draw()}
function dk(){if($('sd'))dsl();S.dw=$('dw').value;S.dm=$('da2').value;S.dq=$('dnt').value;draw()}
function sd(){const w=$('dw').value.trim(),a=pn($('da2').value);if(!w||!a){toast('نام و مبلغ را وارد کنید');return}if($('sd'))dsl();const o={...S.ddt};o.d=Math.min(o.d,o.m<=6?31:30);debts.push({id:++id,who:w,a,dir:S.dd==='lent'?'lent':'owe',dt:o,note:$('dnt').value.trim()});S.df=false;toast('قرض ثبت شد');draw()}
function tgl(k){if(k==='pin'){if(S.pin)lk('off');else if(cOK())lk('set');else toast('این مرورگر از رمزگذاری پشتیبانی نمی‌کند');return}if(k==='dark'){S.dark=!S.dark;document.documentElement.dataset.theme=S.dark?'dark':'light'}else S[k]=!S[k];draw()}
const ymNow=()=>{const o=sol(new Date());return o.y*12+o.m-1};
const cm=x=>x.ym===undefined||x.ym===ymNow();
const MINPIN=6,PBK=310000,enc=new TextEncoder(),dec=new TextDecoder();
let LOCKED=false;try{LOCKED=!!localStorage.getItem('bY1e')}catch(e){}
let KEY=null,SALT=null,Q=Promise.resolve();
const u2b=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)};
const b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const npin=p=>p.trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const cOK=()=>!!(window.crypto&&crypto.subtle);
const dkey=async(p,sl)=>{const m=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:sl,iterations:PBK,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
const seal=async js=>{const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(js));return JSON.stringify({v:1,s:u2b(SALT),i:u2b(iv),d:u2b(new Uint8Array(ct))})};
async function opn(p){const o=JSON.parse(localStorage.getItem('bY1e')),sl=b2u(o.s),k=await dkey(p,sl),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(o.i)},k,b2u(o.d));return{j:JSON.parse(dec.decode(pt)),k,s:sl}}
const snap=()=>({CATS,INC,lim,tx,bills,goals,debts,id,lang:S.lang,dark:S.dark,rem:S.rem});
const SFMSG='ذخیره نشد؛ فضای مرورگر پر است یا حالت خصوصی فعال است. از اطلاعات پشتیبان بگیرید.';let WT=0;
function wsv(){if(Date.now()-WT<60000)return;WT=Date.now();toast(SFMSG)}
function persist(){const js=JSON.stringify(snap());try{localStorage.setItem('bY1l',S.lang);localStorage.setItem('bY1d',S.dark?'1':'')}catch(e){}if(KEY)Q=Q.then(async()=>{try{localStorage.setItem('bY1e',await seal(js))}catch(e){wsv()}});else if(!LOCKED)try{localStorage.setItem('bY1',js)}catch(e){wsv()}}
function lkWait(){try{const f=JSON.parse(localStorage.getItem('bY1f')||'{}');if(!f.n||f.n<4)return 0;return Math.max(0,Math.min(300,5*2**(f.n-4))*1000-(Date.now()-f.t))}catch(e){return 0}}
function lkFail(){try{const f=JSON.parse(localStorage.getItem('bY1f')||'{}');localStorage.setItem('bY1f',JSON.stringify({n:(f.n||0)+1,t:Date.now()}))}catch(e){}}
function lkPrep(){try{const l=localStorage.getItem('bY1l');if(['fa','ps','en'].includes(l))S.lang=l;if(localStorage.getItem('bY1d')){S.dark=true;document.documentElement.dataset.theme='dark'}}catch(e){}const h=document.documentElement;h.lang={fa:'fa-AF',ps:'ps-AF',en:'en'}[S.lang];h.dir=S.lang==='en'?'ltr':'rtl'}
function lk(mode){let o=$('lk');if(!o){o=document.createElement('div');o.id='lk';o.className='lk';document.querySelector('.ph').appendChild(o)}
const t=tx2,F=(i,ph)=>`<input class="fld" id="${i}" type="password" inputmode="numeric" autocomplete="off" placeholder="${t(ph)}" style="text-align:center" onkeydown="if(event.key==='Enter')lkgo('${mode}')">`;
const ttl=mode==='set'?'تنظیم رمز':mode==='off'?'رمز فعلی را وارد کنید':'رمز خود را وارد کنید',go=mode==='set'?'فعال کردن قفل':mode==='off'?'غیرفعال کردن قفل':'باز کردن';
o.innerHTML=`<div class="lkb"><img src="icon-192.png" width="72" height="72" alt="" style="border-radius:18px;margin:0 auto 4px"><h2>${t(ttl)}</h2>${mode==='set'?`<p class="lkn">${t('هشدار: اگر رمز را فراموش کنید، اطلاعات قابل بازیابی نیست. حتماً از اطلاعات پشتیبان بگیرید.')}</p>${F('lp1','رمز (حداقل ۶ رقم)')}${F('lp2','تکرار رمز')}`:F('lp1','رمز')}<div class="lkm" id="lkm" role="alert"></div><button class="btn" id="lkg" onclick="lkgo('${mode}')">${t(go)}</button>${mode==='set'||mode==='off'?`<button class="lks" onclick="lkx()">${t('لغو')}</button>`:`<button class="lks" onclick="lkf()">${t('رمز را فراموش کرده‌ام')}</button>`}</div>`;
setTimeout(()=>{const e=$('lp1');if(e)e.focus()},60)}
function lkx(){const o=$('lk');if(o)o.remove();draw()}
function lkf(){if(confirm(tx2('اطلاعات رمزگذاری‌شده بدون رمز قابل بازیابی نیست. اگر فایل پشتیبان دارید، بعد از پاک کردن می‌توانید آن را برگردانید. همهٔ اطلاعات پاک شود؟'))&&confirm(tx2('مطمئن هستید؟ این کار قابل بازگشت نیست.'))){try{['bY1e','bY1','bY1f'].forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}}
async function lkgo(mode){const m=$('lkm'),b=$('lkg'),say=x=>{m.textContent=tx2(x)},p1=npin($('lp1').value);say('');
if(!cOK()){say('این مرورگر از رمزگذاری پشتیبانی نمی‌کند');return}
if(mode==='set'){
if(p1.length<MINPIN){say('رمز باید حداقل ۶ رقم باشد');return}
if(p1!==npin($('lp2').value)){say('دو رمز یکسان نیست');return}
b.disabled=true;
try{const sl=crypto.getRandomValues(new Uint8Array(16)),k=await dkey(p1,sl);SALT=sl;KEY=k;await Q;localStorage.setItem('bY1e',await seal(JSON.stringify(snap())));localStorage.removeItem('bY1');LOCKED=true;S.pin=true}catch(e){KEY=null;SALT=null;b.disabled=false;say('این مرورگر از رمزگذاری پشتیبانی نمی‌کند');return}
lkx();toast('قفل فعال شد');return}
if(!p1)return;
const chkW=mode==='unlock'||mode==='relock';
if(chkW&&lkWait()>0){say('چند لحظه صبر کنید و دوباره امتحان کنید');return}
b.disabled=true;let r;try{r=await opn(p1)}catch(e){}
b.disabled=false;
if(!r){if(chkW)lkFail();say('رمز اشتباه است');const e=$('lp1');e.value='';e.focus();return}
try{localStorage.removeItem('bY1f')}catch(e){}
if(mode==='unlock'){applyState(r.j);KEY=r.k;SALT=r.s;S.pin=true;lkx();return}
if(mode==='relock'){const o=$('lk');if(o)o.remove();return}
if(mode==='off'){await Q;try{localStorage.setItem('bY1',JSON.stringify(snap()));localStorage.removeItem('bY1e')}catch(e){say(SFMSG);return}KEY=null;SALT=null;LOCKED=false;S.pin=false;lkx();toast('قفل غیرفعال شد')}}
let HT=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){HT=Date.now();return}if(KEY&&HT&&Date.now()-HT>60000&&!$('lk'))lk('relock')});
function applyState(j){CATS.splice(0,CATS.length,...j.CATS);INC.splice(0,INC.length,...j.INC);lim=j.lim||{};tx=j.tx||[];bills=j.bills||[];goals=j.goals||[];debts=j.debts||[];id=j.id||10;S.rem=j.rem;S.lang=j.lang||'fa';const h=document.documentElement;h.lang={fa:'fa-AF',ps:'ps-AF',en:'en'}[S.lang];h.dir=S.lang==='en'?'ltr':'rtl';if(j.dark){S.dark=true;h.dataset.theme='dark'}}
function bk(){const b=new Blob([JSON.stringify(snap())],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='budgetyar-backup.json';a.click();toast('نسخه پشتیبان ذخیره شد')}
function okb(j){const A=Array.isArray,O=x=>x&&typeof x==='object'&&!A(x),P=x=>A(x)&&x.every(c=>A(c)&&typeof c[0]==='string'&&typeof c[1]==='string');return O(j)&&P(j.CATS)&&j.CATS.length>0&&P(j.INC)&&j.INC.length>0&&A(j.tx)&&j.tx.every(x=>O(x)&&typeof x.a==='number')&&['bills','goals','debts'].every(k=>A(j[k])&&j[k].every(O))&&j.bills.every(b=>typeof b.a==='number'&&typeof b.n==='string'&&b.dd>=1&&b.dd<=31)&&(j.lim===undefined||O(j.lim))&&['fa','ps','en'].includes(j.lang||'fa')}
function rs(el){const f=el.files&&el.files[0];el.value='';if(!f)return;const bad=()=>toast('فایل پشتیبان معتبر نیست');if(f.size>5e6){bad();return}const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result)}catch(e){}if(!okb(j)){bad();return}if(!confirm(tx2('با بازگردانی، اطلاعات فعلی جایگزین می‌شود. ادامه می‌دهید؟')))return;delete j.pin;const js=JSON.stringify(j);Q.then(async()=>{try{if(KEY)localStorage.setItem('bY1e',await seal(js));else localStorage.setItem('bY1',js)}catch(e){toast(SFMSG);return}toast('اطلاعات بازگردانی شد');setTimeout(()=>location.reload(),900)})};r.onerror=bad;r.readAsText(f)}
(function(){if(LOCKED)return;try{const j=JSON.parse(localStorage.getItem('bY1')||'null');if(j)applyState(j)}catch(e){}})();
if(LOCKED){lkPrep();lk('unlock')}else draw();
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('نسخه جدید آماده شد؛ برنامه را ببندید و دوباره باز کنید')});
addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)navigator.serviceWorker.getRegistration().then(r=>r&&r.update().catch(()=>{})).catch(()=>{})})}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
</body>
